name: kasir_umkm_offline
description: "Kasir Laci - Aplikasi POS Kasir & Inventori 100% Offline-First untuk UMKM."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  mobile_scanner: ^6.0.4
  print_bluetooth_thermal: ^1.1.2
  esc_pos_utils_plus: ^2.0.4
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
